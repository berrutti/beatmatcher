name: Build and Release

on:
  push:
    branches: [main]

jobs:
  build-mac:
    if: "startsWith(github.event.head_commit.message, 'chore: release')"
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - run: yarn install --frozen-lockfile

      - run: yarn build:wasm

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: v__VERSION__
          releaseBody: |
            ## Install

            | Platform | Download |
            |----------|----------|
            | macOS | `.dmg` below |
            | Windows | `.exe` below |
            | Linux | `.AppImage` or `.deb` below |

            ### macOS first launch
            The app is not code-signed. After dragging it to Applications, run once in Terminal:
            ```bash
            xattr -cr /Applications/Beatmatcher.app
            ```
          releaseDraft: false
          prerelease: false

  build-win:
    if: "startsWith(github.event.head_commit.message, 'chore: release')"
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
        shell: bash

      - run: yarn install --frozen-lockfile

      - run: yarn build:wasm

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__

  build-linux:
    if: "startsWith(github.event.head_commit.message, 'chore: release')"
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libasound2-dev libdbus-1-dev

      - run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - run: yarn install --frozen-lockfile

      - run: yarn build:wasm

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
