[package]
name = "beatmatcher"
version = "8.2.0"
description = "DJ software for live mixing and session editing. Play on your keyboard or MIDI controller"
authors = ["berrutti"]
edition = "2021"
rust-version = "1.77.2"
default-run = "beatmatcher"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "compare_session"
path = "src/bin/compare_session.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
session-core = { path = "../session-core" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
flacenc = "0.5"
cpal = "0.15"
midir = "0.10"
symphonia = { version = "0.5", features = ["mp3", "aac", "flac", "vorbis", "wav", "ogg"] }
rfd = "0.15"
tokio = { version = "1", features = ["rt", "time", "sync"] }
base64 = "0.22"
dirs = "6"

# Optimize all dependencies (symphonia, cpal, etc.) even in dev builds.
# Our own code stays unoptimized for fast recompiles and usable stack traces.
[profile.dev.package."*"]
opt-level = 3
